name: "API - Bookmarks - Bookmark lists"

on:
  workflow_dispatch:
    inputs:
      daily_dev_token:
        description: "Daily.dev token (optional, overrides the DAILY_DEV_TOKEN secret)"
        required: false
        type: string

jobs:
  request:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: GET /bookmarks/lists
        run: bash .github/scripts/request.sh
        env:
          ENDPOINT_PATH: "/bookmarks/lists"
          INPUTS: ${{ toJSON(inputs) }}
          DAILY_DEV_TOKEN: ${{ inputs.daily_dev_token || secrets.DAILY_DEV_TOKEN }}
