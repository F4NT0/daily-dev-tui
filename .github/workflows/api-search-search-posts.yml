name: "API - Search - Search posts"

on:
  workflow_dispatch:
    inputs:
      daily_dev_token:
        description: "Daily.dev token (optional, overrides the DAILY_DEV_TOKEN secret)"
        required: false
        type: string
      q:
        description: "search term"
        required: true
        type: string
      time:
        description: "time (day, week, month, year, all)"
        required: false
        type: string
      limit:
        description: "limit (1-50)"
        required: false
        type: string
      cursor:
        description: "cursor (pagination)"
        required: false
        type: string

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GET /search/posts
        run: bash .github/scripts/request.sh
        env:
          ENDPOINT_PATH: "/search/posts"
          INPUTS: ${{ toJSON(inputs) }}
          DAILY_DEV_TOKEN: ${{ inputs.daily_dev_token || secrets.DAILY_DEV_TOKEN }}
