name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Build assets
        run: |
          mkdir -p out
          export CGO_ENABLED=0
          build() { # <dir> <goos> <goarch> <output>
            (cd "$1" && GOOS="$2" GOARCH="$3" go build -trimpath -ldflags "-s -w" -o "$GITHUB_WORKSPACE/out/$4" .)
          }
          for arch in amd64 arm64; do
            build daily-dev-tui linux  "$arch" "daily-dev-tui-linux-$arch"
            build daily-dev-tui darwin "$arch" "daily-dev-tui-darwin-$arch"
          done
          build daily-dev-tui       windows amd64 daily-dev-tui.exe
          build daily-dev-installer windows amd64 daily-dev-setup.exe
          cp install.sh out/install.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --generate-notes --verify-tag
