name: "API - Feeds - By source"

on:
  workflow_dispatch:
    inputs:
      daily_dev_token:
        description: "Daily.dev token (optional, overrides the DAILY_DEV_TOKEN secret)"
        required: false
        type: string
      source:
        description: "source id or handle"
        required: true
        type: string
      limit:
        description: "limit (1-50)"
        required: false
        type: string
      cursor:
        description: "cursor (pagination)"
        required: false
        type: string

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GET /feeds/source/{source}
        run: bash .github/scripts/request.sh
        env:
          ENDPOINT_PATH: "/feeds/source/{source}"
          INPUTS: ${{ toJSON(inputs) }}
          DAILY_DEV_TOKEN: ${{ inputs.daily_dev_token || secrets.DAILY_DEV_TOKEN }}
