name: "API - Feeds - By tag"

on:
  workflow_dispatch:
    inputs:
      daily_dev_token:
        description: "Daily.dev token (optional, overrides the DAILY_DEV_TOKEN secret)"
        required: false
        type: string
      tag:
        description: "tag"
        required: true
        type: string
      limit:
        description: "limit (1-50)"
        required: false
        type: string
      cursor:
        description: "cursor (pagination)"
        required: false
        type: string

jobs:
  request:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: GET /feeds/tag/{tag}
        run: bash .github/scripts/request.sh
        env:
          ENDPOINT_PATH: "/feeds/tag/{tag}"
          INPUTS: ${{ toJSON(inputs) }}
          DAILY_DEV_TOKEN: ${{ inputs.daily_dev_token || secrets.DAILY_DEV_TOKEN }}
