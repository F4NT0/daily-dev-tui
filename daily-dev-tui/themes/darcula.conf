# daily-dev theme: Darcula
# Colors are ANSI 256 numbers (0-255) or hex values (#rrggbb / #rgb).
# Missing or invalid keys fall back to the default theme.

# Titles, banner, selected post and focused borders
primary = #cc7832
# Post subtitle (source name, author)
secondary = #6897bb
# Secondary text: stats, hints, footer
muted = #808080
# Field labels and keys
key = #ffc66d
# URLs
link = #287bde
# Tag chip text and background
tag_fg = #2b2b2b
tag_bg = #9876aa
# Unfocused panel and card borders
border = #555555
# Error messages
error = #ff6b68
# Bookmarked post border
bookmark = #bbb529
# Prompts and version on the login screen
accent = #9876aa
# Login screen tagline
info = #6a8759
