# daily-dev theme: default
#
# Colors are ANSI 256 numbers (0-255) or hex values (#rrggbb / #rgb).
# Themes live in the themes/ directory next to the program. Press t in the TUI to
# switch between them, or start with DAILY_DEV_THEME=<name>.
# To make your own, copy this file to themes/<name>.conf and edit the colors.
# Missing or invalid keys fall back to the default theme.

# Titles, banner, selected post and panel borders in focus
primary = 135
# Post subtitle (source name, author)
secondary = 111
# Secondary text: stats, hints, footer
muted = 245
# Field labels and keys
key = 178
# URLs
link = 86
# Tag chip text and background
tag_fg = 0
tag_bg = 141
# Unfocused panel and card borders
border = 240
# Error messages
error = 196
# Bookmarked post border
bookmark = 208
# Prompts and version on the login screen
accent = 214
# Login screen tagline
info = 75
